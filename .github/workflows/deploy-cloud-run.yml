name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - production_beta_web
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1054359019154/locations/global/workloadIdentityPools/github-pool/providers/bhogiweb-provider
          service_account: github-bhogi-web-deploy@bhogi-401318.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: bhogi-401318
          service: bhogi-web
          region: us-central1
          source: .
          flags: --allow-unauthenticated --port=8080 --memory=256Mi --cpu=1 --min-instances=0 --max-instances=3
